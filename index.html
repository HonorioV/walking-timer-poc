<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Walking Timer POC</title><style>body{font:18px system-ui;background:#f3f5f8;color:#17212b;padding:20px}main{max-width:440px;margin:auto}section{background:white;border-radius:18px;padding:24px;text-align:center}#phase{background:#64748b;color:white;padding:16px;border-radius:12px}#clock{font-size:76px;font-weight:bold;margin:24px}button{font:inherit;padding:14px;border:0;border-radius:12px;margin:5px;background:#dce4eb}#start{background:#16803d;color:white}#log{white-space:pre-wrap;font:12px monospace;text-align:left;margin-top:20px}label{display:block;margin:12px}</style><main><h2>My Walking Timer</h2><p>60-second iPhone voice and alarm test</p><section><div id="phase">READY</div><div id="clock">00:10</div><p id="total">Elapsed 0 / 60 seconds</p><button id="start">Start</button><button id="pause" disabled>Pause</button><button id="reset">Reset</button><label><input type="checkbox" id="voice" checked> Voice</label><label><input type="checkbox" id="alarm" checked> Alarm</label><button id="audio">Test audio</button><div id="log"></div></section><p><small>Lock-screen announcements are experimental. Test by listening, not just reading the event log.</small></p></main><script>
const $=id=>document.getElementById(id),steps=[['Warm-up','#c47a0a','Let us begin. Warm up.'],['Normal walk','#2563eb','Start your normal walk.'],['Brisk walk','#15803d','Time for brisk walking.'],['Normal walk','#2563eb','Return to normal walking.'],['Brisk walk','#15803d','Time for brisk walking.'],['Cool-down','#7e22ce','Start your cool down.']];let state='ready',elapsed=0,anchor=0,last=-1,ctx;function log(s){$('log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n'}function audio(){try{ctx ||= new(window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(e=>log(e.message))}catch(e){log(e.message)}}function say(s){if($('alarm').checked&&ctx){try{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=750;g.gain.value=.12;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25)}catch(e){log(e.message)}}if($('voice').checked&&'speechSynthesis'in window){let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.onstart=()=>log('Speech started');u.onerror=e=>log('Speech error '+e.error);speechSynthesis.speak(u)}log(s)}function tick(){if(state!=='running')return;elapsed=Date.now()-anchor;if(elapsed>=60000){state='done';$('clock').textContent='00:00';$('phase').textContent='COMPLETE';$('total').textContent='Elapsed 60 / 60 seconds';$('start').disabled=false;$('pause').disabled=true;say('Congratulations! Workout complete.');return}const i=Math.floor(elapsed/10000);if(i!==last){if(i>last+1)log('Skipped '+(i-last-1)+' interval alerts');last=i;say(steps[i][2])}$('phase').textContent=steps[i][0].toUpperCase();$('phase').style.background=steps[i][1];$('clock').textContent='00:'+String(Math.ceil((10000-elapsed%10000)/1000)).padStart(2,'0');$('total').textContent='Elapsed '+Math.floor(elapsed/1000)+' / 60 seconds'}setInterval(tick,100);$('start').onclick=()=>{audio();elapsed=0;last=-1;anchor=Date.now();state='running';$('start').disabled=true;$('pause').disabled=false;tick()};$('pause').onclick=()=>{if(state==='running'){elapsed=Date.now()-anchor;state='paused';$('pause').textContent='Resume';speechSynthesis.cancel()}else if(state==='paused'){audio();anchor=Date.now()-elapsed;state='running';$('pause').textContent='Pause';tick()}};$('reset').onclick=()=>{state='ready';elapsed=0;last=-1;if('speechSynthesis'in window)speechSynthesis.cancel();$('phase').textContent='READY';$('phase').style.background='#64748b';$('clock').textContent='00:10';$('total').textContent='Elapsed 0 / 60 seconds';$('start').disabled=false;$('pause').disabled=true;$('pause').textContent='Pause';log('Reset')};$('audio').onclick=()=>{audio();say('Audio test. My Walking Timer.')};document.addEventListener('visibilitychange',()=>{log('Page '+document.visibilityState);tick()});</script></html>
