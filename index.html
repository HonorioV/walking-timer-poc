<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Walking Timer</title><style>body{font:17px system-ui;background:#f1f5f9;color:#182334;padding:16px}main{max-width:460px;margin:auto}section{background:white;border-radius:20px;padding:22px;text-align:center;box-shadow:0 4px 20px #0001}#phase{border-radius:15px;padding:17px;background:#c47a0a;color:white;font-weight:750;font-size:23px}#clock{font-size:70px;font-weight:750;font-variant-numeric:tabular-nums;margin:20px 0}button{font:inherit;border:0;border-radius:12px;padding:14px;margin:4px;background:#e2e8f0}#start{background:#15803d;color:white}button:disabled{opacity:.5}#detail{color:#475569}small{color:#64748b}audio{width:100%;margin-top:15px}#log{font:12px monospace;white-space:pre-wrap;text-align:left;margin-top:12px}</style><main><h2>🚶 My Walking Timer</h2><p>MWT-005 · 36-minute integration test</p><section><div id="phase">READY</div><div id="clock">36:00</div><p id="detail">3-min warm-up · 5 normal/brisk cycles · 3-min cool-down</p><button id="start">Start walk</button><button id="pause" disabled>Pause</button><button id="reset">Reset</button><audio id="audio" controls playsinline preload="none"></audio><p><small>Keep iPhone media volume up. A chime marks each 3-minute phase. English speech is experimental while unlocked; locked-screen spoken guidance is not yet integrated.</small></p><div id="log"></div></section></main><script>
const $=x=>document.getElementById(x),audio=$('audio'),dur=2160,stages=[['Warm-up','#c47a0a','Start your warm up.']];for(let i=0;i<5;i++){stages.push(['Normal walk','#2563eb','Walk at your normal pace.']);stages.push(['Brisk walk','#15803d','Now switch to brisk walking.'])}stages.push(['Cool-down','#7e22ce','Begin your cool down.']);let last=-1,blob=null;
function log(t){$('log').textContent=t+'\n'+$('log').textContent.slice(0,500)}
function build(){const sr=4000,n=sr*dur,b=new Uint8Array(44+n),v=new DataView(b.buffer);function s(p,x){for(let i=0;i<x.length;i++)b[p+i]=x.charCodeAt(i)}s(0,'RIFF');v.setUint32(4,36+n,true);s(8,'WAVE');s(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);s(36,'data');v.setUint32(40,n,true);for(let i=0;i<n;i++){const t=i/sr,k=t%180;let x=.018*Math.sin(2*Math.PI*165*t);if(k<.55){let e=Math.sin(Math.PI*k/.55)**2;x+=.55*e*Math.sin(2*Math.PI*740*t)}b[44+i]=Math.round(128+Math.max(-1,Math.min(1,x))*120)}return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function say(t){if(document.hidden||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.93;speechSynthesis.speak(u)}catch(e){}}
function render(){let t=Math.min(dur,audio.currentTime||0),idx=Math.min(11,Math.floor(t/180)),r=Math.max(0,Math.ceil(dur-t));$('clock').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');$('phase').textContent=t>=dur?'COMPLETE':stages[idx][0].toUpperCase();$('phase').style.background=t>=dur?'#475569':stages[idx][1];$('detail').textContent=t>=dur?'Walking session complete':('Phase '+(idx+1)+' of 12 · '+Math.floor(t/60)+' min elapsed');if(!audio.paused&&t<dur&&idx!==last){last=idx;log('Phase '+(idx+1)+': '+stages[idx][0]);say(stages[idx][2])}}
$('start').onclick=async()=>{try{if(!blob){$('detail').textContent='Preparing 36-minute audio track…';await new Promise(r=>setTimeout(r,30));blob=build();audio.src=blob;audio.load()}audio.currentTime=0;last=-1;await audio.play();$('pause').disabled=false;render()}catch(e){log('Audio error: '+e.message)}};
$('pause').onclick=()=>{if(audio.paused)audio.play().catch(e=>log(e.message));else audio.pause()};
$('reset').onclick=()=>{audio.pause();audio.currentTime=0;last=-1;$('pause').disabled=true;speechSynthesis?.cancel();render()};
audio.addEventListener('timeupdate',render);audio.addEventListener('play',()=>{$('pause').textContent='Pause';render()});audio.addEventListener('pause',()=>{$('pause').textContent='Resume'});audio.addEventListener('ended',()=>{render();say('Congratulations! Your walking session is complete.');log('Session completed')});render();
</script></html>
